<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>통합 생성기</title>
<meta name="description" content="게임·책·신화 무기·포켓몬 공방의 그림 지시문을 한 곳에서 — 공방 → 화풍 → 대상 → 출력 → 단계별로 고른다.">
<meta name="theme-color" content="#0f0e12">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<!--
  통합 생성기 — 네 공방(게임·책·신화 무기·포켓몬)의 그림 지시문을 한 화면에서(2026-10-29, 사용자). README 「통합 생성기」.
  공방을 고르면 그 공방의 표·조립 코드(/<공방>/lib/…, 같은 출처라 그대로 싣는다)로 다시 열고, 화풍은 그 공방 기본으로 맞춘다.
  일상컷은 트리(/<공방>/data/casual-tree.json) 차례대로 고르고, 단계마다 해방(트리 밖도 보기)·랜덤(트리 안). 폼 초상·개방(game·book)·초상·각성·저주·스킨(myth)·액션·폭주(pkm)는 그 공방 설계대로 — 단계 표는 prompt/steps.js. 옛 생성기는 그대로 둔다.
  지시문은 그 공방 조립 코드가 짓는다(prompt/adapters.js — 옛 생성기와 같은 입력, tests/prompt-parity.cjs). 고른 값은 이 기기에만(atelier_hub_prompt_v1).
-->
<style>
:root {
  --bg: #0b0a0e; --card: #18161d; --card2: #201d26; --line: #ffffff1a; --text: #f1ece2; --muted: #a8a09a; --gold: #d9b45a; --bad: #ff8f80; --good: #9fd6a4;
  --serif: 'Noto Serif KR', 'Apple Myungjo', 'Nanum Myeongjo', Georgia, serif;
  --sans: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); overflow-x: hidden; min-height: 100vh; min-height: 100dvh;
  background-image: radial-gradient(90% 50% at 50% -10%, #1b1726 0%, transparent 70%); background-repeat: no-repeat; }
a { color: var(--gold); }
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: calc(16px + env(safe-area-inset-top)) 16px 8px; max-width: 1100px; margin: 0 auto; }
.head h1 { margin: 0; font: 900 clamp(24px, 3.6vw, 36px)/1.1 var(--serif); letter-spacing: -.02em;
  background: linear-gradient(180deg, #fff 30%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head h1 small { display: block; margin-bottom: 6px; -webkit-text-fill-color: var(--gold); color: var(--gold); font: 700 11px/1 var(--serif); letter-spacing: .4em; }
.home { display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border: 1px solid #ffffff33; border-radius: 99px; background: #000b;
  color: var(--text); text-decoration: none; font: 600 13px/1 var(--sans); white-space: nowrap; }
.home:hover, .home:focus-visible { border-color: var(--gold); color: var(--gold); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px calc(40px + env(safe-area-inset-bottom)); }
.lede { margin: 2px 0 14px; color: var(--muted); font-size: 13px; word-break: keep-all; }
#status { min-height: 1.4em; margin: 0 0 8px; color: var(--muted); font-size: 13px; }

/* 고른 단계 — 칩 한 줄. 누르면 그 단계로 */
.hchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.hchip { display: inline-flex; align-items: baseline; gap: 6px; min-height: 44px; padding: 8px 12px; border: 1px solid #ffffff2b; border-radius: 12px;
  background: #ffffff08; cursor: pointer; font: 600 13px/1.3 var(--sans); text-align: left; max-width: 100%; }
.hchip small { color: var(--muted); font-weight: 500; font-size: 11px; }
.hchip.on { border-color: var(--gold); background: #d9b45a1f; }
.hchip .lock { font-size: 12px; }

.panel { margin: 0 0 18px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); }
.panel h3 { margin: 0 0 6px; font: 800 18px/1.3 var(--serif); }
.panel h4 { margin: 12px 0 6px; color: var(--gold); font: 700 13px/1.3 var(--sans); }
.panel .note { margin: 0 0 10px; color: var(--muted); font-size: 13px; word-break: keep-all; }
.opts { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
/* 대상 목록은 페이지가 스크롤한다 — 안에 따로 스크롤하는 상자를 두면 폰에서 상자 끝에 닿았을 때 막힌다(2026-10-29 사용자 「캐릭터 선택에서 스크롤이 안 내려가」) */
.opts.people { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.opt { display: grid; gap: 2px; align-content: start; min-height: 44px; padding: 10px 12px; border: 1px solid #ffffff22; border-radius: 10px; background: #ffffff06;
  cursor: pointer; text-align: left; text-decoration: none; color: var(--text); word-break: keep-all; }
.opt b { font-weight: 700; font-size: 14px; }
.opt b i { font-style: normal; color: var(--muted); font-weight: 500; font-size: 12px; }
.opt span { color: var(--muted); font-size: 12px; line-height: 1.35; }
.opt[aria-pressed="true"] { border-color: var(--gold); background: #d9b45a1f; }
.opt:disabled { opacity: .45; cursor: default; }
.opt.out { opacity: .55; border-style: dashed; }
.opt.out .why { color: var(--bad); }
.opt.out[aria-pressed="true"] { opacity: 1; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin: 12px 0 0; }
.unlock { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--muted); font-size: 13px; }
.unlock input { width: 20px; height: 20px; }
.rand { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.btn { min-height: 44px; padding: 0 14px; border: 1px solid #ffffff33; border-radius: 99px; background: #000b; cursor: pointer; font: 600 13px/1 var(--sans); }
.btn:hover { border-color: var(--gold); color: var(--gold); }
.find { position: sticky; top: 0; z-index: 2; margin: 0 -16px; padding: 8px 16px 0; background: var(--card); }   /* 긴 목록을 내려가도 찾기는 위에 */
.find input { width: 100%; min-height: 44px; padding: 8px 12px; border: 1px solid #ffffff2e; border-radius: 10px; background: #0f0e13; margin: 0 0 8px; }
.axis { display: grid; gap: 4px; margin: 0 0 10px; font-size: 13px; color: var(--muted); }
.axis select { width: 100%; min-width: 0; min-height: 44px; padding: 8px 12px; border: 1px solid #ffffff2e; border-radius: 10px; background: #0f0e13; color: var(--text); }

.axis input, .axis textarea { min-height: 44px; padding: 8px 12px; border: 1px solid #ffffff2e; border-radius: 10px; background: #0f0e13; color: var(--text); width: 100%; }
.axis textarea { resize: vertical; }
.axis small { color: var(--muted); font-size: 12px; line-height: 1.4; }
/* 폼·개방 — 설계표 한 묶음, 외형 묶음 */
.facts { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 12px 0 0; font-size: 13px; }
.facts dt { color: var(--gold); font-weight: 700; }
.facts dd { margin: 0; color: var(--muted); word-break: keep-all; }
.grp { margin: 0 0 8px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
.grp summary { min-height: 44px; display: flex; align-items: center; cursor: pointer; font-weight: 700; }
.grp[open] { padding-bottom: 8px; }
.result { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--card2); }
.result h3 { margin: 0 0 6px; font: 800 18px/1.3 var(--serif); }
.result textarea { width: 100%; min-height: 260px; padding: 10px 12px; border: 1px solid #ffffff2e; border-radius: 10px; background: #0f0e13; font: 13px/1.5 var(--mono); resize: vertical; }
.result .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 0 8px; }
.result .row small { color: var(--muted); }
#unlocked-note { color: var(--bad); font-size: 13px; }
@media (max-width: 600px) { .opts { grid-template-columns: 1fr 1fr; } .opts.people { grid-template-columns: 1fr 1fr; } }

/* ── 폰(폭 ≤ 768) — docs/PROMPT_MOBILE_PLAN.md ① 칩 레일 한 줄 + 아래 고정 막대(2026-10-29).
   칩은 줄바꿈 대신 가로 스크롤 한 줄(지금 칸이 가운데, 다음 칸은 ▸ 로 미리 하나), 단계의 단추(이전·해방·랜덤·다음)는 아래 고정 막대로 — 긴 목록 끝까지 안 내려가도 손에 닿는다.
   PC 는 그대로(칩 줄바꿈·판 밑 단추). 막대와 판 밑 단추는 hub.js 가 폭을 보고 하나만 그린다 */
.hbar, .hsheet, #help { display: none; }
.head-acts { display: flex; gap: 8px; align-items: center; }
@media (max-width: 768px) {
  /* 아래 막대·위 레일에 가리지 않게 — scrollIntoView·초점 이동이 그 안쪽으로 온다 */
  html { scroll-padding-top: calc(var(--hchips-h, 110px) + 10px); scroll-padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
  /* ① 머리 줄이기 — 제목 한 줄, 설명 글은 「?」 로 */
  .head { align-items: center; padding: calc(10px + env(safe-area-inset-top)) 16px 6px; }
  .head h1 { font-size: 22px; } .head h1 small { display: none; }
  #help { display: inline-flex; min-width: 44px; padding: 0; justify-content: center; }
  .lede { display: none; } body.help .lede { display: block; }
  /* 경로 한 줄 — 공방 › 화풍 › 대상 › 출력 · n/N(지금 칸은 금빛), 그 아래 단계 칩 레일 */
  .hchips { display: block; padding: 6px 16px 8px; }
  .hpath { display: flex; align-items: center; gap: 4px; margin: 0 0 6px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; font-size: 13px; color: var(--muted); }
  .hpath::-webkit-scrollbar { display: none; }
  .hpath i { font-style: normal; opacity: .6; }
  .hcrumb { flex: 0 0 auto; min-height: 44px; padding: 0 6px; border: 0; background: none; color: var(--text); font: 600 13px/1 var(--sans); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .hcrumb.on { color: var(--gold); }
  .hpath .n { flex: 0 0 auto; position: sticky; right: 0; margin-left: auto; padding: 4px 0 4px 10px; background: linear-gradient(90deg, transparent, var(--bg) 10px); color: var(--gold); font: 700 12px/1 var(--mono); }   /* 경로가 길어 옆으로 밀려도 n/N 은 오른쪽에 붙는다 */
  .hrail { display: flex; gap: 6px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; }
  .hrail::-webkit-scrollbar { display: none; }
  /* ③ 결과 — 다 고르면 판 첫 칸, 단계 중엔 시트. #out 은 숨기고 값만 쓴다 */
  #out { display: none; }
  .hres { margin: 0 0 14px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card2); }
  .hres .h { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 6px; } .hres .h b { font: 800 17px/1.3 var(--serif); } .hres .h small { color: var(--muted); }
  .hres-text { position: relative; margin: 0; max-height: 190px; overflow: hidden; white-space: pre-wrap; word-break: break-word; font: 12px/1.5 var(--mono); color: #d8d2c8; }
  .hres-text::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 60px; background: linear-gradient(180deg, transparent, var(--card2)); }
  .hres-text.open { max-height: none; } .hres-text.open::after { display: none; }
  .hres .more { margin: 6px 0 0; min-height: 44px; padding: 0; border: 0; background: none; color: var(--gold); font: 600 13px/1 var(--sans); }
  .hsheet { display: block; position: fixed; inset: 0; z-index: 8; background: #000a; }
  .hsheet[hidden] { display: none; }
  .hsheet .pane { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86dvh; display: flex; flex-direction: column; gap: 8px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: var(--card2); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; }
  .hsheet .h { display: flex; align-items: center; gap: 8px; } .hsheet .h b { font: 800 17px/1.3 var(--serif); } .hsheet .h small { flex: 1 1 auto; color: var(--muted); font-size: 12px; }
  .hsheet textarea { flex: 1 1 auto; min-height: 40dvh; width: 100%; padding: 10px 12px; border: 1px solid #ffffff2e; border-radius: 10px; background: #0f0e13; font: 12px/1.5 var(--mono); color: var(--text); resize: none; }
  .hsheet .rand { margin: 0; } .hsheet .pri { background: var(--gold); color: #120b16; border-color: var(--gold); font-weight: 800; }
  body.sheet .hbar { display: none; }
  /* ⑤ 대상 — 칸마다 그리기를 미룬다(1,025명), 건너뛰기 자리는 레일·찾기 칸 아래로 */
  .opts.people .opt { content-visibility: auto; contain-intrinsic-size: auto 64px; scroll-margin-top: 180px; }
  .gtabs.jump { position: sticky; top: var(--hchips-h, 116px); z-index: 2; margin-top: -4px; padding-top: 6px; padding-bottom: 6px; background: var(--card); }
  /* ⑥ 고르개는 라벨과 한 줄 */
  .axis:has(> select) { display: grid; grid-template-columns: 38% 1fr; align-items: center; gap: 4px 8px; }
  .axis:has(> select) small { grid-column: 1 / -1; }
  .hchips { position: sticky; top: 0; z-index: 4; flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; margin: 0 -16px 12px; padding: 8px 16px;
    background: linear-gradient(180deg, var(--bg) 85%, transparent); }
  .hchips::-webkit-scrollbar { display: none; }
  .hchip { flex: 0 0 auto; display: block; max-width: 170px; min-height: 44px; padding: 9px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.3; scroll-snap-align: center; }
  .hchip small { margin-right: 2px; }
  .hchip.next { color: var(--muted); border-style: dashed; }
  .panel { scroll-margin-top: 64px; }
  .wrap { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }   /* 아래 막대 자리 */
  .hbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; gap: 6px; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: #0f0e13f2; border-top: 1px solid var(--line); backdrop-filter: blur(8px); }
  .hbar[hidden], body.kb .hbar { display: none; }
  .hbar .btn, .hbar .unlock { flex: 1 1 0; min-width: 0; justify-content: center; border-radius: 12px; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hbar .ico { flex: 0 0 44px; padding: 0; }
  .hbar .pri { flex: 1.2 1 0; background: var(--gold); color: #120b16; border-color: var(--gold); font-weight: 800; }
  .hbar .unlock { flex: 1.3 1 0; display: flex; align-items: center; justify-content: flex-start; gap: 6px; border: 1px solid #ffffff33; background: #000b; color: var(--text); font: 600 13px/1 var(--sans); cursor: pointer; }
  .hbar .unlock input { flex: 0 0 16px; width: 16px; height: 16px; margin: 0; accent-color: var(--gold); }   /* 상자는 늘 글상자 안에 — 가운데 정렬이면 좁을 때 밖으로 밀려 눌리지 않는다 */
  .hbar .unlock span { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .hbar .unlock i { font-style: normal; color: var(--muted); } .hbar:has(> :nth-child(4)) .unlock i { display: none; }   /* 막대가 넷 이상이면 셈은 숨긴다(「해방 (…」 로 잘리지 않게) */
  .hbar .unlock:has(input:checked) { border-color: var(--gold); color: var(--gold); }
  /* ④ 선택지 1열 줄 — 제목 왼쪽, 꼬리(묶음·영어 설명·까닭) 오른쪽 한 줄. 대상 목록은 2열 그대로(1열이면 1,025명이 두 배로 길다) */
  .opts { grid-template-columns: minmax(0, 1fr); gap: 6px; }   /* minmax(0, …) — 한 줄로 안 접는 글이 칸을 넓히지 않게 */
  .opts.people { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .opts:not(.people) .opt { display: flex; align-items: center; gap: 10px; min-height: 48px; min-width: 0; padding: 0 12px; }
  .opts:not(.people) .opt::before { content: ''; flex: none; width: 14px; height: 14px; border-radius: 50%; border: 2px solid #ffffff55; }
  .opts:not(.people) .opt[aria-pressed="true"]::before { background: var(--gold); border-color: var(--gold); box-shadow: inset 0 0 0 3px #201d26; }
  .opts:not(.people) .opt b { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opts:not(.people) .opt b i { display: none; }   /* 묶음 이름은 오른쪽 꼬리로 */
  .opts:not(.people) .opt span { flex: 0 1 46%; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .opts:not(.people) .opt.out { opacity: .6; }
  /* 묶음 탭 — 한 줄 가로 스크롤, 전체 · 묶음마다 수 */
  .gtabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 10px; padding: 2px 16px; }
  .gtabs::-webkit-scrollbar { display: none; }
  .gtab { flex: 0 0 auto; min-height: 44px; padding: 0 12px; border: 1px solid #ffffff22; border-radius: 99px; background: #ffffff06; color: var(--muted); font: 600 13px/1 var(--sans); white-space: nowrap; }
  .gtab i { font-style: normal; opacity: .7; margin-left: 2px; }
  .gtab.on { background: var(--gold); color: #120b16; border-color: var(--gold); }
  .gtab.on i { opacity: .8; }
  .panel h4 { position: sticky; top: var(--hchips-h, 60px); z-index: 1; margin: 10px -4px 6px; padding: 4px 4px; background: var(--card); }   /* 전체 보기에서 묶음 이름은 레일 아래에 붙는다 */
  /* 랜덤 메뉴 — 막대 위로 뜬다 */
  .hmenu { position: fixed; right: 10px; bottom: calc(68px + env(safe-area-inset-bottom)); z-index: 7; display: grid; gap: 6px; padding: 8px; border: 1px solid var(--line); border-radius: 14px; background: #18161df8; box-shadow: 0 10px 30px #000a; }
  .hmenu .btn { justify-content: flex-start; width: 100%; }
}
</style>
</head>
<body>
<header class="head">
  <h1><small>ATELIER · 통합</small>통합 생성기</h1>
  <div class="head-acts"><button type="button" class="home" id="help" aria-label="설명 보기">?</button><a class="home" href="./">공방 지도</a></div>
</header>
<main class="wrap">
  <p class="lede">공방을 고르면 그 공방의 화풍·대상·트리로 이어진다. 고른 단계는 위 칩으로 접히고, 누르면 그 단계로 돌아간다. 옛 공방 생성기는 그대로 있다.</p>
  <p id="status" role="status"></p>
  <nav class="hchips" id="chips" aria-label="고른 단계"></nav>
  <section class="panel" id="panel" aria-live="polite"></section>
  <section class="result" id="out" hidden>
    <div class="row"><h3>지시문</h3><small id="count"></small></div>
    <p id="unlocked-note"></p>
    <textarea id="prompt" readonly aria-label="지시문"></textarea>
    <div class="row"><button type="button" class="btn" id="copy">복사</button><button type="button" class="btn" id="record">기록 JSON</button><small id="copied" role="status"></small></div>
