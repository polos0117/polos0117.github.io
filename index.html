<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공방 모음</title>
<meta name="description" content="건담 · 삼국지 · 포켓몬 · 신화 무기 · 책 — 공방 지도에서 방을 골라 들어간다.">
<meta name="theme-color" content="#0f0e12">
<link rel="icon" href="icon-192.png?v=2">
<link rel="manifest" href="app.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png?v=2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="공방">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<!--
  첫 화면 = 공방 지도 한 장(img/map.webp 2896×2172 — 지붕을 걷어낸 큰 건물, 방 여섯 — 위 셋·아래 셋). 방 자리는 ROOMS 표의 다각형(1448×1086 기준 좌표 — 그림은 그 2배라 비율로 맞는다)이고
  SVG viewBox 가 그림 크기라 화면이 바뀌어도 같이 늘어난다. 글자는 그림에 없다 — 이름표·미리보기는 화면이 얹는다.
  방에 올리면 빛나고 이름·대표 그림이 뜬다. 누르면 지도가 그 방으로 다가가고(transform) 그 공방의 문들(하위 링크)이 보인다.
  주소에 #gundam 처럼 남아 뒤로 가기·공유가 된다. 등불이 복도를 오간다(SMIL). 지도 아래 "모든 공방" 목록은 지도가 불편한 사람·화면 읽기 프로그램의 길.
  그림을 바꾸면 ROOMS 의 다각형 숫자만 다시 잰다.
  살아 있는 불 — 다섯 공방이 한 출처(polos0117.github.io)라 localStorage 를 같이 쓴다. 각 공방은 판이 끝나면 atelier_today_v1:<방> 에 오늘 기록
  {d, n, w, daily, at, seen} 한 칸을 적고(today.js — 다섯 저장소에 같은 파일, 약속은 README 「오늘 기록」), 지도는 그걸 읽어 오늘 다녀간 방에 불을 켜고
  이름표 아래 "오늘 n판 · w승"을, 문 패널에 「오늘의 판」(?daily — 날짜가 씨앗) 을 둔다. 공방의 첫 화면을 HEAD 로 물어 Last-Modified 가 마지막으로
  다녀간 뒤(seen)라면 이름표에 초록 점 — 새 소식. 문을 누르면 그 방에 다녀간 자국(seen)을 남긴다.
-->
<style>
:root {
  --bg: #0b0a0e; --card: #18161d; --line: #ffffff1a; --text: #f1ece2; --muted: #a8a09a; --gold: #d9b45a;
  --serif: 'Noto Serif KR', 'Apple Myungjo', 'Nanum Myeongjo', Georgia, serif;
  --sans: system-ui, -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-behavior: smooth; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 var(--sans); overflow-x: hidden; }
a { color: inherit; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ── 머리 — 작게. 지도가 주인공 ── */
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: calc(14px + env(safe-area-inset-top)) 16px 6px; max-width: 1280px; margin: 0 auto; }
.head h1 { flex: none; white-space: nowrap; margin: 0; font: 900 clamp(22px, 3.4vw, 34px)/1.1 var(--serif); letter-spacing: -.02em;   /* 제목은 줄지도 꺾이지도 않는다 — 좁은 폰에서 안내 글에 밀려 「음」 이 밑줄로 떨어졌다 */
  background: linear-gradient(180deg, #fff 30%, var(--gold) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.head h1 small { display: block; margin-top: 4px; -webkit-text-fill-color: var(--gold); color: var(--gold); font: 700 11px/1 var(--serif); letter-spacing: .4em; }
.head p { flex: 1 1 auto; min-width: 0; margin: 0; color: var(--muted); font-size: 12px; text-align: right; word-break: keep-all; }
.head p a { color: var(--gold); text-decoration: none; }

/* ── 지도 ── */
.map { position: relative; max-width: 1280px; margin: 0 auto; padding: 0 8px; display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.stage { position: relative; aspect-ratio: 1448 / 1086; width: 100%; overflow: hidden; border-radius: 14px; background: #06070b radial-gradient(70% 60% at 50% 45%, #1b1726, #06070b 70%); isolation: isolate; }
.inner { position: absolute; inset: 0; transform-origin: 0 0; transition: transform .7s cubic-bezier(.2, .8, .2, 1); will-change: transform; }
.inner > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; }
.inner > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* 방 — 다각형. 올리면 빛나고, 다가간 방은 더 밝게. 다른 방은 다가가는 동안 어두워진다 */
.room polygon { fill: var(--c); fill-opacity: 0; stroke: var(--c); stroke-opacity: 0; stroke-width: 6; stroke-linejoin: round; transition: fill-opacity .25s, stroke-opacity .25s; cursor: pointer; }
.room:hover polygon, .room:focus-visible polygon, .room.hot polygon { fill-opacity: .16; stroke-opacity: .85; filter: url(#glow); }
.room:focus-visible { outline: none; }
.map.zoomed .room:not(.on) polygon { fill: #000; fill-opacity: .55; stroke-opacity: 0; filter: none; pointer-events: none; }
.map.zoomed .room.on polygon { fill-opacity: 0; stroke-opacity: .18; filter: none; }
/* 이름표 — 늘 보이는 작은 패. 올리면 미리보기 카드가 그 위에 */
.pins { position: absolute; inset: 0; pointer-events: none; }
.pin { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 6px; transition: opacity .3s; }
.pin b { padding: 4px 11px; border-radius: 99px; background: #000b; border: 1px solid color-mix(in srgb, var(--c) 60%, transparent); color: #fff; font: 700 12px/1.3 var(--serif); letter-spacing: .04em; white-space: nowrap; box-shadow: 0 2px 10px #0009; }
.pin .peek { position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%) translateY(6px); width: 150px; padding: 8px; border-radius: 12px; background: #0c0b11f2; border: 1px solid color-mix(in srgb, var(--c) 55%, transparent); box-shadow: 0 16px 40px #000c, 0 0 30px color-mix(in srgb, var(--c) 30%, transparent); opacity: 0; transition: opacity .2s, transform .2s; }
.pin .peek img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 50% 15%; border-radius: 8px; }
.pin .peek i { display: block; margin-top: 6px; color: var(--muted); font: 600 11px/1.4 var(--sans); font-style: normal; white-space: normal; text-align: center; word-break: keep-all; }
.pin.hot .peek { opacity: 1; transform: translateX(-50%) translateY(0); }
.map.zoomed .pin { opacity: 0; }
@media (max-width: 760px) { .pin b { padding: 3px 8px; font-size: 10px; } .pin .peek { width: 118px; } }
/* 등불 — 복도를 오간다 */
.lamp { fill: #ffd27a; filter: url(#lamp); }
.lamp.b { fill: #9fc8ff; }
/* 오늘 불 — 오늘 판을 둔 방은 불이 켜져 있다(각 공방이 atelier_today_v1:<방> 에 적은 기록을 읽는다) */
.room.lit polygon { fill-opacity: .07; }
.glow { fill: #ffb763; filter: url(#lamp); transform-box: fill-box; transform-origin: center; animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.85); } 50% { opacity: .7; transform: scale(1.15); } }
.pin .today { padding: 2px 8px; border-radius: 99px; background: #2a1d10e6; border: 1px solid #ffb76366; color: #ffd9a8; font: 600 10px/1.3 var(--sans); white-space: nowrap; }
.pin .today[hidden] { display: none; }
.pin.news b::after { content: ''; display: inline-block; width: 7px; height: 7px; margin-left: 6px; border-radius: 50%; background: #7cf0a8; box-shadow: 0 0 8px #7cf0a8; vertical-align: middle; }
.doors .status { margin: 4px 0 10px; color: #ffd9a8; font-size: 13px; }
.doors .status:empty { display: none; }
.news-word { color: #7cf0a8; }
/* 오늘의 판 — 문들 줄 끝의 따뜻한 단추. 끝냈으면 초록 표 */
.links a.daily { gap: 6px; border-color: #ffb76388; background: #2a1d10b3; color: #ffd9a8; }
.links a.daily:hover, .links a.daily:focus-visible { border-color: #ffd9a8; color: #ffd9a8; }
.links a.daily .done { color: #7cf0a8; }
@media (max-width: 760px) { .pin .today { font-size: 9px; padding: 1px 6px; } }
/* 다가갔을 때 문 패널 */
.doors { display: none; padding: 14px 16px 16px; border: 1px solid color-mix(in srgb, var(--c, var(--gold)) 50%, transparent); border-radius: 14px; background: var(--card); box-shadow: 0 0 40px color-mix(in srgb, var(--c, var(--gold)) 18%, transparent); }
.map.zoomed .doors { display: block; }
.doors .num { color: var(--c); font: 700 12px/1 var(--serif); letter-spacing: .3em; }
.doors h2 { margin: 8px 0 2px; font: 900 clamp(24px, 3.6vw, 36px)/1.15 var(--serif); letter-spacing: -.02em; }
.doors .sub { color: color-mix(in srgb, var(--c) 70%, #fff); font-weight: 600; font-size: 14px; }
.doors p { margin: 10px 0 14px; color: #d8d2c8; font-size: 14px; max-width: 34em; word-break: keep-all; }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a, .links button { min-height: 42px; display: inline-flex; align-items: center; padding: 0 16px; border: 1px solid #ffffff33; border-radius: 99px; background: #000b; color: var(--text);
  text-decoration: none; font: 600 14px/1 var(--sans); cursor: pointer; transition: border-color .15s, color .15s, transform .15s; }
.links a:hover, .links a:focus-visible, .links button:hover, .links button:focus-visible { border-color: var(--c, var(--accent)); color: var(--c, var(--accent)); outline: none; transform: translateY(-1px); }
.links a.main { background: var(--c, var(--accent)); border-color: var(--c, var(--accent)); color: #111; font-weight: 800; }
.links a.main:hover { color: #111; filter: brightness(1.08); }
.doors .back { margin-top: 12px; }
.hint { max-width: 1280px; margin: 6px auto 0; padding: 0 16px; color: #6f6973; font-size: 12px; text-align: center; }
/* 가로 — 지도가 화면 높이에 들어가게(4:3 그대로, 너비를 줄인다). 다가가면 문 패널이 오른쪽에 */
@media (orientation: landscape) {
  .stage { width: min(100%, calc((100dvh - 96px) * 1448 / 1086)); margin: 0 auto; }
  .map.zoomed { grid-template-columns: minmax(0, 1fr) minmax(260px, 340px); align-items: start; }
  .map.zoomed .stage { width: 100%; }
}
@media (orientation: landscape) and (max-height: 500px) {
  /* 제목·안내를 지도 위에 겹쳐 지도가 높이를 다 쓴다 */
  body { position: relative; }
  .head { position: absolute; left: 0; right: 0; top: 0; z-index: 3; padding: calc(6px + env(safe-area-inset-top)) 14px 0; pointer-events: none; }
  .head p, .head h1 { pointer-events: auto; text-shadow: 0 2px 8px #000; }
  .head h1 { font-size: 18px; } .head h1 small { display: none; }
  .map { padding-top: calc(4px + env(safe-area-inset-top)); }
  .stage { width: min(100%, calc((100dvh - 8px - env(safe-area-inset-top)) * 1448 / 1086)); }
  .hint { display: none; }
  body.zoomed .head { display: none; }   /* 다가가면 제목·안내 글이 확대된 그림·문 패널과 겹친다 — 숨긴다("← 지도로" 가 길) */
  .doors { padding: 10px 12px 12px; } .doors h2 { font-size: 22px; } .doors p { margin: 6px 0 10px; font-size: 13px; }
  .links a, .links button { min-height: 38px; padding: 0 12px; font-size: 13px; }
}
/* 폰 세로 — 다가가면 무대를 조금 키워(4:3 보다 높게) 방이 크게 보이게 */
@media (max-width: 760px) and (orientation: portrait) {
  .map.zoomed .stage { aspect-ratio: auto; height: 58vh; }
}

/* ── 맨 아래 — 모든 공방 한눈에. 지도가 불편할 때의 길이라 짧게: 한 공방 = 한 줄(작은 그림 · 이름 · 문들) ──
   큰 세로 카드 다섯이면 휴대폰 세로에서 화면 넷을 굴러야 했고, PC 에선 넷 + 하나로 끊겼다 */
.all { position: relative; z-index: 2; padding: 40px 16px calc(40px + env(safe-area-inset-bottom)); background: var(--bg); }
.all > * { max-width: 880px; margin-left: auto; margin-right: auto; }
.all h2 { margin: 0 auto 4px; font: 900 22px/1.3 var(--serif); }
.all > p { margin: 0 auto 14px; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 0; border-top: 1px solid var(--line); }
.card { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 4px 14px; align-items: center; padding: 12px 4px; border-bottom: 1px solid var(--line); }
.card .cover { grid-row: 1 / span 2; display: block; width: 64px; aspect-ratio: 3 / 4; overflow: hidden; border-radius: 8px; background: var(--tint); box-shadow: inset 0 0 0 1px #ffffff14; }
.card .cover img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; display: block; transition: transform .25s; }
.card:hover .cover img, .card:focus-within .cover img { transform: scale(1.06); }
.card .head2 { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.card .name { margin: 0; font: 800 17px/1.3 var(--serif); color: var(--text); text-decoration: none; white-space: nowrap; }
.card .name::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 8px; border-radius: 50%; background: var(--accent); vertical-align: middle; transform: translateY(-2px); }
.card .sub { min-width: 0; color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card .links { gap: 6px; }
.card .links a { min-height: 34px; padding: 0 11px; font-size: 12px; background: #ffffff08; }
.card .links a.main { background: var(--accent); border-color: var(--accent); }
.card .links a:hover, .card .links a:focus-visible { border-color: var(--accent); color: var(--accent); }
.card .links a.main:hover, .card .links a.main:focus-visible { color: #111; }
@media (min-width: 720px) {
  .card { grid-template-columns: 56px minmax(150px, 220px) minmax(0, 1fr); padding: 10px 4px; }
  .card .cover { grid-row: auto; width: 56px; }
  .card .head2 { flex-direction: column; align-items: flex-start; gap: 2px; }
  .card .sub { max-width: 100%; }
}
/* 내 즐겨찾기(favorites.html) — 목록 아래 한 줄. 담은 수는 favorites.js 가 센다 */
.all-fav { margin: 14px auto 0; display: flex; flex-wrap: wrap; gap: 10px; }   /* 즐겨찾기 · 도트 공방(dot.html) */
.all-fav a { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border: 1px solid #ffffff33; border-radius: 99px; background: #ffffff08;
  text-decoration: none; font: 700 14px/1.2 var(--serif); transition: border-color .15s, color .15s; }
.all-fav a span { color: var(--gold); }
.all-fav a i { color: var(--muted); font: 500 12px/1.3 var(--sans); font-style: normal; }
.all-fav a:hover { border-color: var(--gold); }
.all-fav a:focus-visible { border-color: var(--gold); outline: 2px solid var(--gold); outline-offset: 2px; }
/* 머리의 「즐겨찾기 n」 — 글줄 높이는 그대로 두고 누르는 자리만 44px */
.head p a#fav-link { display: inline-flex; align-items: center; min-height: 44px; margin: -12px -6px; padding: 0 6px; border-radius: 8px; }
.head p a#fav-link:focus-visible { outline: 2px solid var(--gold); outline-offset: -4px; }
footer { position: relative; z-index: 2; background: var(--bg); text-align: center; color: #6f6973; font-size: 12px; padding-bottom: calc(24px + env(safe-area-inset-bottom)); }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .inner, .pin, .pin .peek, .room polygon { transition: none; }
  .lamp { display: none; }
  .glow { animation: none; opacity: .55; }
}
</style>
</head>
<body>

<header class="head">
  <h1><small>ATELIER</small>공방 모음</h1>
  <p>방을 누르면 들어간다 · <a href="#all">목록으로 보기</a> · <a href="favorites.html" id="fav-link">즐겨찾기</a></p>
</header>

<section class="map" id="map" aria-label="공방 지도">
  <div class="stage" id="stage">
    <div class="inner" id="inner">
      <img src="img/map.webp" alt="지붕을 걷어낸 큰 건물 안에 방 여섯 — 격납고·서재·군막·연구소·오락실·대장간" decoding="async" fetchpriority="high">
      <svg id="svg" viewBox="0 0 1448 1086" aria-hidden="true" focusable="false">
        <defs>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <filter id="lamp" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          <!-- 복도 — 등불이 다니는 길. 그림을 바꾸면 같이 다시 긋는다(2026-10-26 오락실이 옛 복도 자리에 들어와 첫 길은 입구에서 오락실을 지나 뒤 복도로) -->
          <path id="way1" d="M 615 905 C 630 760, 640 600, 660 470 C 700 440, 800 440, 900 450 C 980 455, 1000 480, 960 500"/>
          <path id="way2" d="M 660 470 C 640 420, 600 420, 560 410 C 480 395, 300 400, 150 420 C 280 405, 500 410, 630 430"/>
          <path id="way3" d="M 1300 560 C 1200 540, 1100 520, 980 500 C 900 480, 760 460, 690 480 C 760 500, 900 520, 1300 560"/>
        </defs>
        <g id="rooms"></g>
        <g id="glows"></g>
        <g id="lamps">
          <circle class="lamp" r="5"><animateMotion dur="22s" repeatCount="indefinite" rotate="0"><mpath href="#way1"/></animateMotion></circle>
          <circle class="lamp b" r="4"><animateMotion dur="26s" begin="-9s" repeatCount="indefinite"><mpath href="#way2"/></animateMotion></circle>
          <circle class="lamp" r="4"><animateMotion dur="30s" begin="-5s" repeatCount="indefinite"><mpath href="#way3"/></animateMotion></circle>
        </g>
      </svg>
    </div>
    <div class="pins" id="pins" aria-hidden="true"></div>
  </div>
  <aside class="doors" id="doors" aria-live="polite"></aside>
</section>
<p class="hint" id="hint">방에 올리면 이름이, 누르면 그 공방의 문이 보인다 · 오늘 판을 둔 방은 불이 켜진다 · Esc 로 돌아온다</p>

<section class="all" id="all" aria-label="모든 공방">
  <h2>모든 공방</h2>
  <p>바로 들어가기</p>
  <div class="grid" id="cards"></div>
  <p class="all-fav"><a href="favorites.html" id="fav-all"><span aria-hidden="true">♡</span> 내 즐겨찾기 <i id="fav-all-n">공방 도감에서 하트로 담은 그림을 한곳에서</i></a>
    <a href="dot.html" id="dot-all"><span aria-hidden="true">▦</span> 도트 공방 <i>다섯 공방 인물의 도트 — 지시문과 정리기</i></a></p>
</section>
<footer>polos0117 · 개인 공방 · 홈 화면에 추가하면 앱처럼 열린다</footer>

<script src="today.js"></script>
<script src="favorites.js"></script>
<script>
/* 방 표 — 다각형은 img/map.webp 의 픽셀 좌표(1448×1086). 꼭짓점은 방을 두른 벽 윗면의 안쪽 모서리(그림 위에 겹쳐 따 맞춘다 — 2026-10-20 처음 것은 기울기가 반대로 돌아 있었다). 그림을 바꾸면 여기만 다시 잰다.
   at: 이름표 자리, peek: 미리보기 그림(각 공방의 그림 저장소), links: 문들(첫 번째가 큰 문), daily: 오늘의 판(날짜가 씨앗 — 그 공방이 ?daily 를 읽는다) */
const ROOMS = [
  { key: 'gundam', name: '건담 격납고', title: '건담 드래프트', sub: '기동전사 · 3D 격납고', num: '01 / HANGAR', c: '#7fb3ff', tint: '#151a21',
    poly: [[232, 48], [578, 62], [505, 388], [92, 358]], at: [380, 230],
    peek: '/atelier/img/thumb/RX-78-2_건담_f.webp', cover: '/atelier/img/thumb/RX-78-2_건담_f.webp',
    desc: '3D 격납고를 걸어 다니며 기체를 둘러보고, 드래프트로 출격한다.',
    links: [['격납고', '/atelier/'], ['드래프트', '/atelier/play.html'], ['도감', '/atelier/dex.html'], ['프롬프트', '/atelier/prompt.html']], daily: '/atelier/play.html?daily' },
  { key: 'book', name: '책의 서재', title: '책의 공방', sub: '고전 · 발단 · 전개 · 결말', num: '02 / LIBRARY', c: '#e39b6b', tint: '#1c1210',
    poly: [[615, 65], [952, 108], [885, 440], [548, 400]], at: [770, 270],
    peek: '/book-atelier-img/img/thumb/don_quixote_middle_literary_fantasy_f.webp', cover: '/book-atelier-img/img/thumb/don_quixote_middle_literary_fantasy_f.webp',
    desc: '도서관에서 깨어난 책들이, 자신의 이야기를 세상에 남기기 위해 싸운다. 책 한 권이 한 사람이 된다. 결투 한 판, 서고를 아홉 층 내려가는 탐험.',
    links: [['서재', '/book-atelier/'], ['서가', '/book-atelier/dex.html'], ['결투', '/book-atelier/duel.html'], ['탐험', '/book-atelier/run.html'], ['프롬프트', '/book-atelier/prompt.html']], daily: '/book-atelier/duel.html?daily' },
  { key: 'samguk', name: '삼국지 군막', title: '삼국지 쟁탈전', sub: '장수를 뽑아 진영을 꾸린다', num: '03 / 竹簡', c: '#c9a227', tint: '#17130f',
    poly: [[962, 112], [1340, 172], [1300, 548], [898, 462]], at: [1150, 320],
    peek: '/sam-atelier/images/large/관우.jpg', cover: '/sam-atelier/images/large/관우.jpg',
    desc: '위·촉·오의 장수들을 드래프트로 모아 한 진영을 짠다.',
    links: [['들어가기', '/sam-atelier/']], daily: '/sam-atelier/?daily' },
  { key: 'pokemon', name: '포켓몬 연구소', title: '포켓몬 메카 연구소', sub: '메카 의인화 · 연구소', num: '04 / LAB', c: '#f4c542', tint: '#2a2718',
    poly: [[95, 425], [470, 450], [405, 748], [105, 700]], at: [280, 580],
    peek: '/pkm-atelier-img/img/thumb/피카츄_heavy_cinematic_semi_real_f.webp', cover: '/pkm-atelier-img/img/thumb/피카츄_heavy_cinematic_semi_real_f.webp',
    desc: '포켓몬을 메카로 의인화한 도감과 전투, 일곱 판 달리기, 진화 결투, 폼 결투.',
    links: [['연구소', '/pkm-atelier/'], ['도감', '/pkm-atelier/dex.html'], ['전투', '/pkm-atelier/battle.html'], ['런', '/pkm-atelier/run.html'], ['결투', '/pkm-atelier/lane.html'], ['폼 결투', '/pkm-atelier/gwent.html'], ['프롬프트', '/pkm-atelier/prompt.html']], daily: '/pkm-atelier/survey.html?daily' },
  { key: 'myth', name: '신화 무기 대장간', title: '신화 무기 공방', sub: '열한 권 · 백여든일곱 자루', num: '05 / FORGE', c: '#d9b45a', tint: '#121016',
    poly: [[950, 535], [1342, 605], [1305, 878], [885, 848]], at: [1110, 710],
    peek: '/myth-atelier-img/img/thumb/묠니르_game_keyart_f.webp', cover: '/myth-atelier-img/img/thumb/묠니르_game_keyart_f.webp',
    desc: '신화 속 무기가 사람이 되어 싸운다. 오토 배틀러·결투와 3D 박물관.',
    links: [['공방', '/myth-atelier/'], ['오토 배틀', '/myth-atelier/auto.html'], ['박물관', '/myth-atelier/museum.html'], ['도감', '/myth-atelier/dex.html'], ['드래프트', '/myth-atelier/draft.html'], ['던전', '/myth-atelier/run.html'], ['결투', '/myth-atelier/duel.html'], ['프롬프트', '/myth-atelier/prompt.html']], daily: '/myth-atelier/duel.html?daily' },
  /* 오락실(2026-10-26) — 옛 아래 가운데 복도 자리, 앞 계단 입구가 이리로 열린다. 미리보기는 테트리스 타이틀 폼(시범 그림, 2026-10-26).
     오늘의 판(daily)은 결투가 붙으면 적는다 — 없으면 문 패널에 그 문을 두지 않는다 */
  { key: 'game', name: '게임 오락실', title: '게임의 공방', sub: '게임 의인화 · 타이틀 · 중반 · 엔딩', num: '06 / ARCADE', c: '#ff6ad5', tint: '#1d1020',
    poly: [[505, 488], [935, 528], [868, 838], [425, 785]], at: [680, 660],
    peek: '/game-atelier-img/img/thumb/tetris_title_glossy_kr_game_f.webp', cover: '/game-atelier-img/img/thumb/tetris_title_glossy_kr_game_f.webp',
    desc: '게임 한 편이 한 사람이 되고, 그 게임의 조작이 그녀의 능력이 된다. 첫 묶음 열 편의 도감과 그림 프롬프트.',
    links: [['첫 화면', '/game-atelier/'], ['도감', '/game-atelier/dex.html'], ['프롬프트', '/game-atelier/prompt.html']] },
];
const IW = 1448, IH = 1086;
const $ = s => document.querySelector(s);
const map = $('#map'), stage = $('#stage'), inner = $('#inner'), rooms = $('#rooms'), pins = $('#pins'), doors = $('#doors'), cards = $('#cards'), glows = $('#glows');
const T = window.AtelierToday;   /* 오늘 기록(today.js) — 각 공방이 적고 지도가 읽는다 */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const linksHTML = (r, big) => r.links.map(([t, href], i) => `<a href="${href}"${i === 0 ? ' class="main"' : ''}>${esc(t)}</a>`).join('');

/* 방 다각형(SVG) + 이름표(HTML) + 아래 카드 */
for (const r of ROOMS) {
  const a = document.createElementNS('http://www.w3.org/2000/svg', 'a');
  a.setAttribute('href', '#' + r.key); a.setAttribute('class', 'room'); a.setAttribute('data-key', r.key); a.style.setProperty('--c', r.c);
  a.setAttribute('aria-label', r.name + ' — ' + r.title);
  const p = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
  p.setAttribute('points', r.poly.map(q => q.join(',')).join(' '));
  a.appendChild(p); rooms.appendChild(a);
  const pin = document.createElement('div'); pin.className = 'pin'; pin.dataset.key = r.key; pin.style.setProperty('--c', r.c);
  pin.style.left = (r.at[0] / IW * 100) + '%'; pin.style.top = (r.at[1] / IH * 100) + '%';
  pin.innerHTML = `<div class="peek"><img src="${r.peek}" alt="" loading="lazy"><i>${esc(r.title)}</i></div><b>${esc(r.name)}</b><span class="today" hidden></span>`;
  pins.appendChild(pin);
  /* 오늘 불 — 방 가운데 숨 쉬는 빛. 오늘 판을 둔 방에만 보인다 */
  const g = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  g.setAttribute('class', 'glow'); g.setAttribute('data-key', r.key); g.setAttribute('r', '26'); g.setAttribute('cx', r.at[0]); g.setAttribute('cy', r.at[1] - 40); g.style.display = 'none';
  glows.appendChild(g);
  const card = document.createElement('article'); card.className = 'card'; card.dataset.key = r.key; card.style.setProperty('--accent', r.c); card.style.setProperty('--tint', r.tint);
  card.innerHTML = `<a class="cover" href="${r.links[0][1]}" aria-label="${esc(r.title)} 열기" tabindex="-1"><img src="${r.cover}" alt="" loading="lazy"></a>
    <div class="head2"><a class="name" href="${r.links[0][1]}">${esc(r.title)}</a><span class="sub">${esc(r.sub)}</span></div>
    <nav class="links" aria-label="${esc(r.title)}">${linksHTML(r)}${dailyHTML(r)}</nav>`;
  cards.appendChild(card);
}
const roomEl = k => rooms.querySelector(`.room[data-key="${k}"]`), pinEl = k => pins.querySelector(`.pin[data-key="${k}"]`), glowEl = k => glows.querySelector(`.glow[data-key="${k}"]`);

/* ── 오늘 불 · 새 소식 ── */
const NEWS = {};   /* 방 → 그 공방 첫 화면의 Last-Modified(ms). HEAD 로 한 번 묻는다 */
const todayText = t => !t.n ? '' : `오늘 ${t.n}판 · ${t.w}승${t.daily ? ' · 오늘의 판 ✓' : ''}`;
const isNews = k => { const t = T.read(k); return !!(NEWS[k] && t.seen > 0 && NEWS[k] > t.seen); };
function dailyHTML(r) { if (!r.daily) return ''; const t = T.read(r.key); return `<a class="daily" href="${r.daily}">오늘의 판${t.daily ? ' <span class="done">✓ 끝냈다</span>' : ''}</a>`; }
function statusText(r) {
  const t = T.read(r.key), life = T.record(r.key), parts = [];
  if (t.n) parts.push(todayText(t));
  if (life.n) parts.push(`통산 ${life.n}판 ${life.w}승${life.streak > 1 ? ' · ' + life.streak + '연승' : ''}`);
  if (life.dstreak > 0 && T.dailyAlive(r.key)) parts.push(`오늘의 판 연속 ${life.dstreak}일`);
  if (isNews(r.key)) parts.push('<span class="news-word">새 소식 — 지난번 다녀간 뒤 바뀌었다</span>');
  return parts.join(' · ');
}
/* 즐겨찾기 수 — 머리의 「즐겨찾기 n」과 목록 아래 줄(favorites.js — 공방 도감이 담는다) */
function paintFav() {
  const F = window.AtelierFavorites, n = F ? F.count() : 0;
  $('#fav-link').textContent = n ? `즐겨찾기 ${n}` : '즐겨찾기';
  $('#fav-all-n').textContent = n ? `담은 그림 ${n}장` : '공방 도감에서 하트로 담은 그림을 한곳에서';
}
if (window.AtelierFavorites) window.AtelierFavorites.onChange(paintFav);
/* 기록을 다시 읽어 그린다 — 열 때, 다른 공방에서 돌아올 때(pageshow·focus·visibilitychange) */
function paint() {
  paintFav();
  for (const r of ROOMS) {
    const t = T.read(r.key), lit = t.n > 0, pin = pinEl(r.key), line = pin.querySelector('.today');
    roomEl(r.key).classList.toggle('lit', lit); pin.classList.toggle('lit', lit); pin.classList.toggle('news', isNews(r.key));
    line.textContent = todayText(t); line.hidden = !lit; glowEl(r.key).style.display = lit ? '' : 'none';
    const d = cards.querySelector(`.card[data-key="${r.key}"] a.daily`); if (d) d.outerHTML = dailyHTML(r);
  }
  if (on) { const r = ROOMS.find(q => q.key === on), st = $('#status'), d = doors.querySelector('a.daily'); if (st) st.innerHTML = statusText(r); if (d) d.outerHTML = dailyHTML(r); }
}
async function sniff() {
  await Promise.all(ROOMS.map(async r => { try { const res = await fetch(r.links[0][1], { method: 'HEAD', cache: 'no-store' }); const lm = Date.parse(res.headers.get('last-modified')); if (res.ok && isFinite(lm)) NEWS[r.key] = lm; } catch (e) {} }));
  paint();
}
addEventListener('pageshow', paint); addEventListener('focus', paint); document.addEventListener('visibilitychange', () => { if (!document.hidden) paint(); });
/* 문을 누르면 그 방에 다녀간 자국 — 다음에 "새 소식"을 가릴 기준 */
document.addEventListener('click', e => { const a = e.target.closest('a[href]'); if (!a) return; const card = a.closest('.card'); const key = card ? card.dataset.key : a.closest('#doors') ? on : null; if (key) T.visit(key); });


/* 올리면 빛난다 — 다각형과 이름표가 같이 */
let hot = null;
function setHot(k) {
  if (hot === k) return;
  if (hot) { roomEl(hot).classList.remove('hot'); pinEl(hot).classList.remove('hot'); }
  hot = k;
  if (k) { roomEl(k).classList.add('hot'); pinEl(k).classList.add('hot'); }
}
rooms.addEventListener('pointerover', e => { const a = e.target.closest('.room'); if (a) setHot(a.dataset.key); });
rooms.addEventListener('pointerout', e => { const a = e.target.closest('.room'); if (a && !map.classList.contains('zoomed')) setHot(null); });
rooms.addEventListener('focusin', e => { const a = e.target.closest('.room'); if (a) setHot(a.dataset.key); });
rooms.addEventListener('focusout', () => { if (!map.classList.contains('zoomed')) setHot(null); });

/* 누르면 다가간다 — 그 방의 사각형이 무대에 차게 transform. 주소에 #key */
let on = null;
function bbox(r) { const xs = r.poly.map(q => q[0]), ys = r.poly.map(q => q[1]); const x = Math.min(...xs), y = Math.min(...ys); return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y }; }
function fit() {
  if (!on) { inner.style.transform = ''; return; }
  const r = ROOMS.find(q => q.key === on), b = bbox(r), W = stage.clientWidth, H = stage.clientHeight, pad = .06;
  /* 무대 안 그림은 무대를 꽉 채운다(object-fit:fill) — 그림 픽셀 → 무대 픽셀 */
  const sx = W / IW, sy = H / IH;
  const bw = (b.w * (1 + pad * 2)) * sx, bh = (b.h * (1 + pad * 2)) * sy;
  const s = Math.min(W / bw, H / bh);
  const cx = (b.x + b.w / 2) * sx, cy = (b.y + b.h / 2) * sy;
  inner.style.transform = `translate(${(W / 2 - cx * s).toFixed(1)}px, ${(H / 2 - cy * s).toFixed(1)}px) scale(${s.toFixed(4)})`;
}
function enter(k, push) {
  const r = ROOMS.find(q => q.key === k); if (!r) return leave(push);
  on = k; setHot(k);
  map.classList.add('zoomed'); document.body.classList.add('zoomed'); map.style.setProperty('--c', r.c);
  for (const el of rooms.querySelectorAll('.room')) el.classList.toggle('on', el.dataset.key === k);
  doors.innerHTML = `<div class="num">${esc(r.num)}</div><h2>${esc(r.title)}</h2><div class="sub">${esc(r.sub)}</div><p>${esc(r.desc)}</p>
    <p class="status" id="status">${statusText(r)}</p>
    <nav class="links" id="doorlinks" aria-label="${esc(r.title)}">${linksHTML(r)}${dailyHTML(r)}</nav>
    <div class="links back"><button type="button" id="back">← 지도로</button></div>`;
  $('#back').addEventListener('click', () => leave(true));
  if (push && location.hash !== '#' + k) history.pushState({ room: k }, '', '#' + k);
  requestAnimationFrame(fit);
  if (innerWidth < 900 || innerHeight < innerWidth) stage.scrollIntoView({ block: 'start', behavior: 'smooth' });
}
function leave(push) {
  on = null; setHot(null);
  map.classList.remove('zoomed'); document.body.classList.remove('zoomed'); map.style.removeProperty('--c');
  for (const el of rooms.querySelectorAll('.room')) el.classList.remove('on');
  doors.innerHTML = '';
  inner.style.transform = '';
  if (push && location.hash && location.hash !== '#all') history.pushState({}, '', location.pathname + location.search);
}
rooms.addEventListener('click', e => { const a = e.target.closest('.room'); if (!a) return; e.preventDefault(); if (on === a.dataset.key) leave(true); else enter(a.dataset.key, true); });
stage.addEventListener('click', e => { if (on && !e.target.closest('.room.on')) leave(true); });
addEventListener('keydown', e => { if (e.key === 'Escape' && on) leave(true); });
addEventListener('popstate', () => { const k = location.hash.slice(1); if (ROOMS.some(r => r.key === k)) enter(k, false); else if (on) leave(false); });
addEventListener('resize', fit);
addEventListener('load', () => { const k = location.hash.slice(1); if (ROOMS.some(r => r.key === k)) enter(k, false); });
paint(); if (window.fetch) sniff();   /* 맨 끝에 — paint 가 on(다가간 방)을 보므로 그 선언 뒤여야 한다 */
</script>
